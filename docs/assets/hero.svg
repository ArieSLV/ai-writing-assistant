<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">AI Writing Assistant</title>
  <desc id="description">A dark blue banner with a colorful audio waveform and the words Proofread, Translate, Dictate.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#111d35"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="55" r="180" fill="#2563eb" opacity="0.10"/><circle cx="1220" cy="390" r="230" fill="#a855f7" opacity="0.08"/>
  <g transform="translate(84 76)"><rect width="86" height="86" rx="22" fill="#172554" stroke="#60a5fa" stroke-width="2"/><path d="M28 48h8l5-16 8 32 7-23 5 14h9" fill="none" stroke="url(#wave)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/></g>
  <text x="196" y="122" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="55" font-weight="700">AI Writing Assistant</text>
  <text x="198" y="168" fill="#a8b6cf" font-family="Segoe UI, Inter, sans-serif" font-size="23">A global writing shortcut for Windows</text>
  <g transform="translate(86 247)" fill="none" stroke="url(#wave)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"><path d="M0 40h22l13-24 18 54 18-76 18 92 18-62 18 32 18-17h28l18-23 18 52 18-74 18 91 18-57 18 25 18-13h32"/></g>
  <g font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="600">
    <g transform="translate(650 245)"><rect width="154" height="52" rx="26" fill="#0f2747" stroke="#38bdf8"/><text x="77" y="34" fill="#e0f2fe" text-anchor="middle">Proofread</text></g>
    <g transform="translate(824 245)"><rect width="154" height="52" rx="26" fill="#202453" stroke="#818cf8"/><text x="77" y="34" fill="#eef2ff" text-anchor="middle">Translate</text></g>
    <g transform="translate(998 245)"><rect width="154" height="52" rx="26" fill="#34204e" stroke="#c084fc"/><text x="77" y="34" fill="#faf5ff" text-anchor="middle">Dictate</text></g>
  </g>
  <text x="650" y="340" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">Ctrl+Shift+D</text><text x="824" y="340" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">Ctrl+Shift+F</text><text x="998" y="340" fill="#94a3b8" font-family="Consolas, monospace" font-size="18">Ctrl+Shift+G</text>
</svg>
