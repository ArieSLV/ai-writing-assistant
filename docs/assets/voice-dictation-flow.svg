<svg xmlns="http://www.w3.org/2000/svg" width="920" height="960" viewBox="0 0 920 960" role="img" aria-labelledby="title description">
  <title id="title">Voice dictation flow</title>
  <desc id="description">Voice dictation starts with the Ctrl Shift G shortcut, records and normalizes audio, uploads it to Gemini for transcription, replaces the clipboard, and attempts to remove remote and local temporary files.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111d35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f38"/>
      <stop offset="1" stop-color="#162747"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7086ad"/>
    </marker>
  </defs>

  <rect width="920" height="960" rx="28" fill="url(#background)"/>
  <circle cx="835" cy="92" r="180" fill="#2563eb" opacity="0.10"/>
  <circle cx="870" cy="860" r="230" fill="#a855f7" opacity="0.07"/>

  <text x="56" y="57" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="30" font-weight="700">Voice dictation pipeline</text>
  <text x="56" y="88" fill="#9fb0ca" font-family="Segoe UI, Inter, sans-serif" font-size="16">Record visibly. Process quietly. Return clean text to the clipboard.</text>

  <g fill="none" stroke="#7086ad" stroke-width="3" marker-end="url(#arrow)">
    <path d="M311 217V241"/>
    <path d="M311 337V361"/>
    <path d="M311 457V481"/>
    <path d="M311 577V601"/>
    <path d="M311 697V721"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Inter, sans-serif">
    <g>
      <rect x="56" y="125" width="510" height="92" rx="18" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="96" cy="171" r="22" fill="#10334f" stroke="#38bdf8"/>
      <text x="96" y="178" fill="#dff6ff" font-size="18" font-weight="700" text-anchor="middle">1</text>
      <text x="134" y="163" fill="#f8fafc" font-size="21" font-weight="650">Start or stop</text>
      <text x="134" y="190" fill="#9fb0ca" font-family="Consolas, monospace" font-size="15">Ctrl + Shift + G</text>
    </g>

    <g>
      <rect x="56" y="245" width="510" height="92" rx="18" fill="url(#card)" stroke="#4fb9ef" stroke-width="1.5"/>
      <circle cx="96" cy="291" r="22" fill="#12344f" stroke="#4fb9ef"/>
      <text x="96" y="298" fill="#dff6ff" font-size="18" font-weight="700" text-anchor="middle">2</text>
      <text x="134" y="283" fill="#f8fafc" font-size="21" font-weight="650">Record WAV</text>
      <text x="134" y="310" fill="#9fb0ca" font-size="15">Movable waveform overlay is visible</text>
      <path d="M446 292h10l7-18 10 35 10-27 8 17h15" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g>
      <rect x="56" y="365" width="510" height="92" rx="18" fill="url(#card)" stroke="#60a5fa" stroke-width="1.5"/>
      <circle cx="96" cy="411" r="22" fill="#172f56" stroke="#60a5fa"/>
      <text x="96" y="418" fill="#e8f1ff" font-size="18" font-weight="700" text-anchor="middle">3</text>
      <text x="134" y="403" fill="#f8fafc" font-size="21" font-weight="650">Normalize audio</text>
      <text x="134" y="430" fill="#9fb0ca" font-size="15">Prepare a Gemini-compatible WAV</text>
    </g>

    <g>
      <rect x="56" y="485" width="510" height="92" rx="18" fill="url(#card)" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="96" cy="531" r="22" fill="#242952" stroke="#818cf8"/>
      <text x="96" y="538" fill="#eef2ff" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="134" y="523" fill="#f8fafc" font-size="21" font-weight="650">Upload to Gemini</text>
      <text x="134" y="550" fill="#9fb0ca" font-size="15">Processing status moves to the tray</text>
    </g>

    <g>
      <rect x="56" y="605" width="510" height="92" rx="18" fill="url(#card)" stroke="#9a83f4" stroke-width="1.5"/>
      <circle cx="96" cy="651" r="22" fill="#302650" stroke="#9a83f4"/>
      <text x="96" y="658" fill="#f1edff" font-size="18" font-weight="700" text-anchor="middle">5</text>
      <text x="134" y="643" fill="#f8fafc" font-size="21" font-weight="650">Smart transcription</text>
      <text x="134" y="670" fill="#9fb0ca" font-size="15">Gemini returns polished text</text>
    </g>

    <g>
      <rect x="56" y="725" width="510" height="92" rx="18" fill="url(#card)" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="96" cy="771" r="22" fill="#3a234d" stroke="#c084fc"/>
      <text x="96" y="778" fill="#faf5ff" font-size="18" font-weight="700" text-anchor="middle">6</text>
      <text x="134" y="763" fill="#f8fafc" font-size="21" font-weight="650">Replace clipboard</text>
      <text x="134" y="790" fill="#9fb0ca" font-size="15">The transcript is ready to paste</text>
    </g>
  </g>

  <g font-family="Segoe UI, Inter, sans-serif" filter="url(#shadow)">
    <rect x="614" y="485" width="250" height="332" rx="22" fill="#111a2d" stroke="#52698e" stroke-width="1.5"/>
    <rect x="638" y="511" width="86" height="28" rx="14" fill="#202b43"/>
    <text x="681" y="531" fill="#b8c5d9" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">CLEANUP</text>
    <text x="638" y="578" fill="#f8fafc" font-size="21" font-weight="650">Every terminal path</text>
    <text x="638" y="606" fill="#9fb0ca" font-size="14">Best-effort removal keeps</text>
    <text x="638" y="627" fill="#9fb0ca" font-size="14">temporary data short-lived.</text>

    <rect x="638" y="658" width="202" height="58" rx="14" fill="#17233a" stroke="#60769a"/>
    <circle cx="663" cy="687" r="7" fill="#818cf8"/>
    <text x="682" y="692" fill="#d9e2f0" font-size="15">Delete remote file</text>

    <rect x="638" y="733" width="202" height="58" rx="14" fill="#17233a" stroke="#60769a"/>
    <circle cx="663" cy="762" r="7" fill="#c084fc"/>
    <text x="682" y="767" fill="#d9e2f0" font-size="15">Delete local recording</text>
  </g>

  <g fill="none" stroke="#7086ad" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)">
    <path d="M566 651H590V645H614"/>
    <path d="M566 771H590V755H614"/>
  </g>

  <g font-family="Segoe UI, Inter, sans-serif">
    <rect x="56" y="864" width="808" height="56" rx="16" fill="#0d1729" stroke="#354969"/>
    <circle cx="84" cy="892" r="6" fill="url(#accent)"/>
    <text x="104" y="898" fill="#aebdd2" font-size="15">The recording window disappears before upload and transcription begin.</text>
  </g>
</svg>
